[package]
name = "commit-classifier"
version = "0.1.0"
edition = "2021"
authors = ["Sasha Luccioni <sasha@anthropic.com>"]
license = "GPL-2.0"
description = "Library for classifying commits using LLMs and embeddings"

[features]
default = []
cuda = ["candle_embed/cuda"]

[dependencies]
# For async operations
tokio = { version = "1.34", features = ["full"] }
async-trait = "0.1"

# For embeddings
candle_embed = { git = "https://git.sr.ht/~sashal/candle_embed", default-features = false }
ndarray = "0.15"

# For vector operations
bincode = "1.3"
hnsw_rs = "0.2.0"

# For text processing
unicode-segmentation = "1.10"
regex = "1.8"

# For error handling
anyhow = "1.0"
log = "0.4"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# For compression
xz2 = "0.1"

# For HTTP
reqwest = { version = "0.11", features = ["json"] }
url = "2.5"

# For LLM providers
ollama-rs = "0.1"
async-openai = "0.28"
anthropic = "0.0.8"
anthropic-sdk = "0.1.5"

# For tests
tempfile = "3.8"

[dev-dependencies]
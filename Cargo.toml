[package]
name = "commit-classifier"
version = "0.1.0"
edition = "2021"
authors = ["Sasha Levin <sashal@kernel.org>"]
license = "GPL-2.0-only"
description = "Library for classifying commits using LLMs and embeddings"
repository = "https://github.com/sashalevin/commit-classifier"
readme = "README.md"

[features]
default = []
cuda = ["candle_embed/cuda"]

[dependencies]
# For async operations
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1.89"

# For embeddings
candle_embed = { git = "https://github.com/ShelbyJenkins/candle_embed", rev = "0a8b2e2ad4a9308906ea0021b1fe520558630171", default-features = false }

# For text processing
regex = "1.12"

# For error handling
log = "0.4.29"

# For serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }

# For compression
xz2 = "0.1.7"

# For HTTP
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"

# For LLM providers
ollama-rs = "0.3"
async-openai = { version = "0.38", default-features = false, features = ["chat-completion", "rustls"] }
anthropic-sdk = "0.1.5"

# For tests
tempfile = "3.27"
